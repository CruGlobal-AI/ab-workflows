name: Docker Build and Push
# Builds a docker image and pushes it to GHCR (ghcr.io/<owner>/<image>).
# Caller job needs: permissions: { contents: read, packages: write }
on:
  workflow_call:
    inputs:
      tags:
        description: Docker tags to publish with (comma separated)
        required: true
        type: string
      base_tag:
        description: Tag of the service-cli base image to build on (master/develop)
        default: master
        type: string
      branch:
        description: Specify the branch to build
        required: false
        type: string
      image:
        description: Image name override (default is derived from the repo name, eg ab_service_user_manager -> ab-user-manager)
        required: false
        type: string
jobs:
  build:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Derive image name
        id: image_name
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ -z "$IMAGE" ]]; then
            NAME="${GITHUB_REPOSITORY#*/}"
            if [[ "$NAME" =~ ^ab_service_(.+)$ ]]; then
              NAME="${BASH_REMATCH[1]}"
            elif [[ "$NAME" =~ ^ab_(.+)$ ]]; then
              NAME="${BASH_REMATCH[1]}"
            fi
            IMAGE="ab-${NAME//_/-}"
          fi
          echo "image=ghcr.io/${OWNER,,}/${IMAGE}" >> $GITHUB_OUTPUT

      - name: Generate Docker Tags
        id: generate_tags
        uses: actions/github-script@v9
        env:
          IMAGE: ${{ steps.image_name.outputs.image }}
          TAGS: ${{ inputs.tags }}
        with:
          script: |
            const { IMAGE, TAGS } = process.env;
            const tags = TAGS.replaceAll("+", "_").split(",");
            core.setOutput("full_tags", tags.map((tag) => `${IMAGE}:${tag}`).join(","));

      - name: Checkout to update the context for building and pushing the Docker package
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: BRANCH=${{ inputs.base_tag }}
          tags: ${{ steps.generate_tags.outputs.full_tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          sbom: true
          provenance: true
