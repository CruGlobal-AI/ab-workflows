name: Cypress E2E Tests
# Runs our Cypress E2E test suite. Installs AppBuilder using the github reference of the calling repository.
#
# Speedups built in:
#   - Pre-pulls every AppBuilder image (from ab_runtime version.json) in the background
#     while checkout / npm i / webpack / DB init run.
#   - Caches ~/.npm, the Cypress binary and node_modules/.cache (webpack / babel).
#   - Waits for the stack with a readiness check instead of a fixed sleep.
#   - Cancels older runs of the same PR, and has a job timeout.
#
# Defaults keep the old behavior for service repos (folder AppBuilder, port 80, test:e2e:app).
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref of the calling repo to test
        type: string
        default: ${{ github.ref }}
      config:
        description: "Spec set, the suffix of an ab_runtime `test:e2e:<config>` script: app | ab-runtime | ab-designer"
        type: string
        default: app
      runtime:
        description: ab_runtime branch / ref to install (ab_runtime itself passes its own ref). Empty = default branch.
        type: string
        default: ""
      folder:
        description: Folder to install AppBuilder in
        type: string
        default: AppBuilder
      port:
        description: Port for the main stack
        type: string
        default: "80"
      checkout_path:
        description: Where to check out the calling repo. Empty = repo name (needed by ab-install-action to rebuild ab_service_* images).
        type: string
        default: ""
      build_web:
        description: Build this repo with webpack into ab_service_web, then test that web image (platform web, PWA, plugins)
        type: boolean
        default: false
      web_branches:
        description: JSON list of {branch, webpack} for the ab_service_web matrix (only used with build_web)
        type: string
        default: '[{"branch":"develop","webpack":"dev"},{"branch":"master","webpack":"update"}]'
      app_id:
        description: GitHub App ID / client ID used to read ab_service_web (only used with build_web). Empty = GITHUB_TOKEN.
        type: string
        default: ""
      timeout_minutes:
        description: Job timeout
        type: number
        default: 25
      cancel_in_progress:
        description: Cancel an older run of the same workflow + PR when a new one starts
        type: boolean
        default: true
    secrets:
      app_secret:
        description: GitHub App private key (pairs with app_id)
        required: false

jobs:
  e2e-tests:
    name: ${{ matrix.branch && format('Cypress E2E Tests ({0})', matrix.branch) || 'Cypress E2E Tests' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    concurrency:
      group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.branch }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_web && inputs.web_branches || '[{"branch":"","webpack":""}]') }}
    env:
      CYPRESS_RESPONSE_TIMEOUT: 200000
      CYPRESS_DEFAULT_COMMAND_TIMEOUT: 30000
      CYPRESS_RETRIES: 2
    steps:
      # Runs first so image pulls overlap with everything below.
      - name: Prepare and pre-pull images
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUNTIME_REF: ${{ inputs.runtime }}
          INPUT_CHECKOUT_PATH: ${{ inputs.checkout_path }}
        run: |
          set -uo pipefail
          checkout_path="${INPUT_CHECKOUT_PATH:-${GITHUB_REPOSITORY#*/}}"
          echo "checkout_path=$checkout_path" >> "$GITHUB_OUTPUT"

          # Read a file from ab_runtime at the ref the install will use (fall back to default branch).
          # (gh prints error bodies on stdout, so only echo output on success)
          runtime_file() {
            local out
            if [ -n "$RUNTIME_REF" ] && out=$(gh api "repos/$OWNER/ab_runtime/contents/$1?ref=$RUNTIME_REF" "${@:2}" 2>/dev/null); then
              printf '%s' "$out"; return 0
            fi
            out=$(gh api "repos/$OWNER/ab_runtime/contents/$1" "${@:2}" 2>/dev/null) && printf '%s' "$out"
          }

          # Cache key part: blob sha of ab_runtime package-lock.json.
          lock_sha=$(runtime_file package-lock.json --jq .sha || true)
          echo "runtime_lock=${lock_sha:-none}" >> "$GITHUB_OUTPUT"

          versions=$(runtime_file version.json -H "Accept: application/vnd.github.raw" || true)
          if [ -z "$versions" ]; then
            echo "::warning::Could not read ab_runtime version.json, skipping image pre-pull"
            exit 0
          fi
          registry="ghcr.io/${OWNER,,}"
          list="$RUNNER_TEMP/prepull-images.txt"
          {
            # mcp_server is listed in version.json but not part of the stack
            jq -r --arg r "$registry" '.services | to_entries[] | select(.key != "mcp_server")
              | "\($r)/ab-\(.key | gsub("_";"-")):\(.value)"' <<<"$versions"
            echo "$registry/ab-migration-manager:master"
            echo "docker.io/library/redis:latest"
            echo "docker.io/library/nginx:latest"
          } > "$list"
          # Two phases: the install needs ab-db + migration-manager first (DB init), the rest only
          # at stack deploy. Pulling all at once slowed DB init by ~50s in service repos.
          first="$RUNNER_TEMP/prepull-first.txt"; rest="$RUNNER_TEMP/prepull-rest.txt"
          grep -E '/ab-(db|migration-manager):' "$list" > "$first" || true
          grep -vE '/ab-(db|migration-manager):' "$list" > "$rest" || true
          echo "Pre-pulling in background, first:"; cat "$first"; echo "then:"; cat "$rest"
          # Best effort: the install pulls anything that failed here.
          # shellcheck disable=SC2016  # $1 is expanded later by sh -c, on purpose
          pull='docker pull -q "$1" >/dev/null 2>&1 && echo "ok   $1 ($(date +%T))" || echo "FAIL $1"'
          nohup bash -c "xargs -P 2 -I{} sh -c '$pull' _ {} < '$first'; xargs -P 4 -I{} sh -c '$pull' _ {} < '$rest'" \
            > "$RUNNER_TEMP/prepull.log" 2>&1 &

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          path: ${{ steps.prep.outputs.checkout_path }}
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.npm
            ~/.cache/Cypress
            ${{ steps.prep.outputs.checkout_path }}/node_modules/.cache
          key: ab-e2e-${{ runner.os }}-${{ steps.prep.outputs.runtime_lock }}-${{ hashFiles(format('{0}/package-lock.json', steps.prep.outputs.checkout_path)) }}-${{ matrix.webpack }}
          restore-keys: |
            ab-e2e-${{ runner.os }}-${{ steps.prep.outputs.runtime_lock }}-
            ab-e2e-${{ runner.os }}-

      # ---- build_web only: webpack this repo into ab_service_web ----
      - name: Generate app token
        id: app-token
        if: inputs.build_web && inputs.app_id != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_secret }}
          repositories: ab_service_web

      - name: Checkout ab_service_web (${{ matrix.branch }})
        if: inputs.build_web
        uses: actions/checkout@v7
        with:
          # webpack writes to ../web (or ../../web for plugins)
          path: web
          repository: ${{ github.repository_owner }}/ab_service_web
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: ${{ matrix.branch }}

      - name: npm i
        if: inputs.build_web
        run: npm i --prefer-offline --no-audit --no-fund
        working-directory: ${{ steps.prep.outputs.checkout_path }}

      - name: Webpack (${{ matrix.webpack }})
        if: inputs.build_web
        run: npm run build:${{ matrix.webpack }}
        working-directory: ${{ steps.prep.outputs.checkout_path }}

      # webpack expects the folder to be called "web", ab-install-action expects "ab_service_web"
      - name: Rename web to ab_service_web
        if: inputs.build_web
        run: mv web ab_service_web
      # ---- end build_web ----

      - name: Install AppBuilder
        uses: CruGlobal-AI/ab-install-action@v1
        with:
          folder: ${{ inputs.folder }}
          port: ${{ inputs.port }}
          runtime: ${{ inputs.runtime }}
          repository: ${{ inputs.build_web && format('{0}/ab_service_web', github.repository_owner) || github.repository }}

      # Save right after install (npm deps + Cypress binary are in place), so a failing test run still saves.
      - name: Save dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.npm
            ~/.cache/Cypress
            ${{ steps.prep.outputs.checkout_path }}/node_modules/.cache
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Check out kitchen-sink tests
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kitchensink_app
          path: ${{ inputs.folder }}/test/e2e/cypress/e2e/kitchensink_app

      - name: Save Logs
        run: |
          npm install pm2@latest -g --prefer-offline --no-audit --no-fund
          pm2 start ./logs.js -- --toFile logs/ABServices.log
        working-directory: ${{ inputs.folder }}

      # ab-install-action only deploys the stack for ab_service_* repos. Deploy it here otherwise,
      # then wait until sails is 1/1 (replaces fixed sleeps).
      - name: Wait for AppBuilder
        working-directory: ${{ inputs.folder }}
        run: |
          echo "::group::Pre-pull results"; cat "$RUNNER_TEMP/prepull.log" 2>/dev/null || echo "(none)"; echo "::endgroup::"
          set -a; . ./.env; set +a
          stack="$CYPRESS_STACK"
          if ! docker stack ls --format '{{.Name}}' | grep -qx "$stack"; then
            echo "Stack $stack not running, deploying"
            ./UP.sh -t -q
          fi
          deadline=$((SECONDS + 300))
          until docker service ls --filter "name=${stack}_" --format '{{.Name}} {{.Replicas}}' | awk '/sails/ {print $2}' | grep -q '^1/1'; do
            [ $SECONDS -ge $deadline ] && { echo "::error::sails not up after 300s"; docker service ls; exit 1; }
            sleep 2
          done
          # No HTTP check on purpose: curl to $CYPRESS_BASE_URL times out on the runner even when
          # Cypress reaches the app fine, so it only burned the full deadline. Cypress waits on its own.
          echo "sails up after ${SECONDS}s"
          docker service ls

      - name: Run Cypress Tests
        run: npm run test:e2e:${{ inputs.config }} -- --browser chrome
        working-directory: ${{ inputs.folder }}

      - name: Save Screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots${{ matrix.branch && format('-{0}', matrix.branch) || '' }}
          path: ./${{ inputs.folder }}/test/e2e/cypress/screenshots

      - name: Save Service Logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ABServices.log${{ matrix.branch && format('-{0}', matrix.branch) || '' }}
          path: ./${{ inputs.folder }}/logs/ABServices.log
